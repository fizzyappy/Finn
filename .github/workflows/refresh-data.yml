# Fresh data for the deployed app without the PC: every weekday after market close
# (16:45 IST), and on demand. Rebuilds the app's data snapshot and commits it; Vercel
# redeploys on the push. Model answers are cached (seed + saved database), so only
# genuinely new filings cost Gemini calls.
# Needs the repository secret GEMINI_API_KEY (Settings -> Secrets and variables -> Actions).
name: refresh-data
on:
  schedule:
    - cron: "15 11 * * 1-5"
  workflow_dispatch:
    inputs:
      research:
        description: "Also re-run company research (only new transcripts cost anything)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: refresh-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      FINN_DATA_DIR: ${{ github.workspace }}/data
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-cloud.txt
      - name: Install
        run: pip install -r backend/requirements-cloud.txt
      - name: Restore the database from the last run
        uses: actions/cache@v4
        with:
          path: data/finn.sqlite
          key: finn-db-${{ github.run_id }}
          restore-keys: finn-db-
      - name: Load the seed (cached model answers and research)
        working-directory: backend
        run: python -m finn.seed load
      - name: Research (only when asked)
        if: ${{ inputs.research == true }}
        working-directory: backend
        run: python -m finn.pull.run RELIANCE HDFCBANK INFY LT SUNPHARMA MARUTI ITC BAJFINANCE VEDL DIXON POLYCAB PERSISTENT INDHOTEL CDSL SUZLON IEX MAPMYINDIA HAPPSTMNDS ASIANPAINT TITAN HAL
      - name: Rebuild the app's data snapshot
        working-directory: backend
        run: python -m finn.export_snapshot
      - name: Update the seed
        working-directory: backend
        run: python -m finn.seed export
      - name: Commit if anything changed
        run: |
          git config user.name "finn-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data backend/seed
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Data refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
